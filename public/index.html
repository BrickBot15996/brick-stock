<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <span class="team-number">15996</span>
  <span class="team-name">Brick Stock</span>
</header>

<main>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="filters" id="filterPills">
        <button class="filter-pill active" data-filter="ALL">All</button>
        <button class="filter-pill" data-filter="AVAILABLE">Available</button>
        <button class="filter-pill" data-filter="IN_USE">In Use</button>
        <button class="filter-pill" data-filter="BROKEN">Broken</button>
      </div>
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search parts, tags, locations...">
      </div>
    </div>
    <div class="toolbar-right">
      <button class="secondary" id="manageTagsBtn">🏷️ Manage Tags</button>
      <button class="primary" id="togglePanelBtn">+ Add Part</button>
    </div>
  </div>

  <div class="panel" id="addPanel">
    <h2>New Part</h2>
    <div class="error-msg" id="addError"></div>
    <div class="form-grid">
      <div class="field">
        <label>Name</label>
        <input type="text" id="f-name" placeholder="e.g. Servo Motor">
      </div>
      <div class="field">
        <label>Quantity</label>
        <input type="number" id="f-quantity" min="0" value="0">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="AVAILABLE">Available</option>
          <option value="IN_USE">In Use</option>
          <option value="BROKEN">Broken</option>
        </select>
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="f-location" placeholder="e.g. Bin A3">
      </div>
      <div class="field">
        <label>Type / Tag</label>
        <div class="type-row">
          <select id="f-type"><option value="">— none —</option></select>
          <button type="button" id="newTypeBtn" title="Add new tag">+</button>
        </div>
      </div>
    </div>
    <div class="panel-actions">
      <button class="ghost" id="cancelAddBtn">Cancel</button>
      <button class="primary" id="submitAddBtn">Add Part</button>
    </div>
  </div>

  <div class="tag-grid" id="tagGrid">
    <div class="empty-state">Loading stock…</div>
  </div>
</main>

<!-- Manage Tags Modal -->
<div class="modal-overlay" id="tagModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Manage Tags</h3>
      <button class="close-modal" id="closeTagModalBtn">✕</button>
    </div>
    <div class="tag-list" id="modalTagList"></div>
    <div style="text-align: right;">
      <button class="ghost" id="closeTagModalGhostBtn">Done</button>
    </div>
  </div>
</div>
<script src= "src/script.js"  ></script>
</body>
</html>
